#
# Publishes the Windows deliverables as real release assets.
#
# The sandboxed build machines this repository is developed on cannot reach
# uploads.github.com, so the release exists but its files do not. This workflow
# runs on GitHub's own runners, rebuilds the installer from source with
# installer/build-windows.sh (which self-tests the packaged blob before
# packing), verifies its own checksums, and attaches the three files to the
# release — so the Assets section of the release page is what it claims to be.
#
# What to BUILD and what to UPLOAD TO are two different questions, and the
# inputs keep them apart:
#
#   ref   branch/tag/commit to build from. Empty (the default) means the ref
#         this run was dispatched on. Never point it at a release tag when
#         re-cutting: the tag is the commit that shipped, and re-cutting means
#         shipping that release's assets from the commit that fixed them.
#   tag   which release to attach the assets to. "latest" (the default) means
#         the repository's latest release.
#
# Run it:
#   • a `v*` tag push — builds the tag, publishes to it.
#   • workflow_dispatch — "Run workflow", or:
#       gh workflow run publish-release-assets.yml --ref main -f tag=v1.0.0
#     which rebuilds `main` and clobbers the v1.0.0 assets and notes. That is
#     how a release is re-cut: same version, fixed bytes.
#
name: Publish release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to attach the assets to (tag name, or "latest")'
        required: false
        default: 'latest'
      ref:
        description: 'Branch/tag/commit to build from (empty: the dispatched ref)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: publish-release-assets-${{ github.event.inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Rebuild the Windows deliverables and attach them to the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The `ref` input wins; otherwise build the ref this run belongs to
          # (tag push → the tag, dispatch → the dispatched branch, which is
          # what a re-cut needs).
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Windows deliverables
        run: bash offline/installer/build-windows.sh

      - name: Verify the build's own checksums
        working-directory: offline/dist
        run: |
          set -euo pipefail
          test -s SoftCora-POS-Setup.exe
          test -s SoftCoraPOS-portable-win64.zip
          test -s sha256.txt
          [ "$(head -c 2 SoftCora-POS-Setup.exe)" = "MZ" ]
          sha256sum -c sha256.txt
          echo '✓ checksums match the exact artifacts being uploaded'

      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ] && [ "${{ github.event.inputs.tag }}" != "latest" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${GITHUB_REF:0:10}" = "refs/tags/" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(gh release view --json tagName -q .tagName --repo "$GITHUB_REPOSITORY")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "→ uploading to release $TAG"

      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            offline/dist/SoftCora-POS-Setup.exe \
            offline/dist/SoftCoraPOS-portable-win64.zip \
            offline/dist/sha256.txt
          gh release edit "$TAG" \
            --notes-file offline/dist/RELEASE-NOTES.md \
            --repo "$GITHUB_REPOSITORY"
          echo "✓ assets attached and notes refreshed on the $TAG release"
