#
# The offline till and its Windows installer.
#
# Two failures on real PCs have shaped this workflow, and neither could be seen
# by the build machine that produced it:
#
#   * a payload script was UTF-8 without a byte-order mark and contained a
#     typographic dash. Windows PowerShell 5.1 reads such a file with the
#     machine's ANSI code page, where that dash decodes into a character
#     PowerShell accepts as a string delimiter - so the script parsed on every
#     machine in this repository and on none of the shop's.
#
#   * the installer's program was built from a Node single-executable blob
#     written by the build host's Node 22 while the runtime it was injected into
#     was Node 26. A blob is only readable by the exact version that wrote it,
#     so every check here passed and the .exe aborted on every Windows PC.
#
# Both are now tested on the host that runs them, not the host that builds them:
#
#   * the project's own checker (ASCII, CRLF, marks, quoting read both ways),
#   * the real PowerShell parser on a Linux runner, where pwsh is installed,
#   * Windows PowerShell 5.1 itself, on a Windows runner, which is the host that
#     actually runs these files - parsing them, running two of them, and
#   * the built installer, unpacked and run end to end on that Windows runner:
#     the program starts, answers its API, installs into %LOCALAPPDATA% and its
#     own health check agrees. That job is the one that would have caught the
#     blob/runtime mismatch in seconds.
#
name: Offline till

on:
  push:
    branches: [main]
    paths:
      - 'offline/**'
      - '.github/workflows/offline-till.yml'
  pull_request:
    paths:
      - 'offline/**'
      - '.github/workflows/offline-till.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-till-${{ github.ref }}
  cancel-in-progress: true

jobs:
  till:
    name: The till, end to end, and the installer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the installer payload
        working-directory: offline
        # pwsh is installed on the GitHub runners, so this run includes the real
        # PowerShell parser reading every .ps1 in both of its possible readings.
        run: node installer/check-payload.mjs installer/payload

      - name: The offline till, end to end
        working-directory: offline
        run: node test/e2e.mjs

      - name: The installer's contracts
        working-directory: offline
        run: node test/installer.mjs

  package:
    name: The Windows deliverables, built once for the other jobs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The build fetches the runtime it ships, pinned by version, and self-tests
      # the packaged blob under that same version. It fails rather than shipping
      # if the pinned version is not published for the host it is building on.
      - name: Build the Windows deliverables
        run: bash offline/installer/build-windows.sh

      - name: Check what was built, before anything else looks at it
        working-directory: offline/dist
        run: |
          set -euo pipefail
          test -s SoftCora-POS-Setup.exe
          test -s SoftCoraPOS-portable-win64.zip
          test -s sha256.txt
          [ "$(head -c 2 SoftCora-POS-Setup.exe)" = "MZ" ]
          cmp Afghan-China-Setup.exe SoftCora-POS-Setup.exe
          sha256sum -c sha256.txt
          echo '✓ the artifacts describe themselves correctly'

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          if-no-files-found: error
          retention-days: 7
          path: |
            offline/dist/SoftCora-POS-Setup.exe
            offline/dist/Afghan-China-Setup.exe
            offline/dist/sha256.txt
            offline/dist/RELEASE-NOTES.md

  windows-payload:
    name: The installer scripts, on the Windows PowerShell that runs them
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse every payload script with Windows PowerShell 5.1
        shell: powershell
        # ParseFile applies the host's own reading rules: a marked file is
        # UTF-8, an unmarked one is the ANSI code page. That is the exact
        # behaviour the shipped installer depends on, so it is the exact
        # behaviour that is tested.
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ("  Windows PowerShell " + $PSVersionTable.PSVersion)

          $files = @(Get-ChildItem -Path offline\installer\payload -Filter *.ps1 -Recurse)
          # The verifier runs on this same host, so it is read the same way.
          $files += @(Get-Item -Path offline\installer\verify-windows.ps1)
          if (-not $files) { throw 'no scripts found' }

          $failed = 0
          foreach ($file in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed++
              foreach ($problem in $errors) {
                Write-Host ("  ! " + $file.Name + ":" + $problem.Extent.StartLineNumber + " " + $problem.Message)
              }
            }
            else {
              Write-Host ("  ok  " + $file.Name)
            }
          }

          if ($failed -gt 0) { throw ($failed.ToString() + ' script(s) do not parse on Windows PowerShell') }

      - name: The payload checker, on Windows
        working-directory: offline
        run: node installer/check-payload.mjs installer/payload

      - name: Run verify.ps1 on a PC with nothing installed
        shell: powershell
        # Executing the scripts is the part that cannot be done on Linux. Both
        # runs below are read-only or fail on purpose, so neither can leave a
        # half-installed till behind.
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = (Resolve-Path offline\installer\payload).Path

          $json = & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $payload 'verify.ps1') -Json
          $code = $LASTEXITCODE
          # The Actions 'powershell' shell ends the step with $LASTEXITCODE, and
          # exit 1 is what this step is asking for - so clear it and judge the
          # code here instead of letting it fail the step.
          $global:LASTEXITCODE = 0

          if ($code -ne 1) { throw ("verify.ps1 should report 'not installed' with exit 1, exited " + $code) }
          $report = ($json -join "`n") | ConvertFrom-Json
          if ($report.installed) { throw 'verify.ps1 reports an installation on a machine that has none' }
          if (@($report.problems).Count -eq 0) { throw 'verify.ps1 exited 1 without saying what is wrong' }
          Write-Host ('  ok  verify.ps1 runs, reports that nothing is installed, and says why: ' + @($report.problems)[0])

      - name: Run install.ps1 against an incomplete payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = (Resolve-Path offline\installer\payload).Path
          $root = Join-Path $env:LOCALAPPDATA 'SoftCoraPOS'

          # A copy with no program inside it: the installer must refuse it before
          # it creates an app or a data folder, and say why.
          $broken = Join-Path $env:TEMP ('softcora-broken-' + [guid]::NewGuid().ToString('n'))
          New-Item -ItemType Directory -Path (Join-Path $broken 'app') -Force | Out-Null
          Copy-Item (Join-Path $payload 'install.ps1') $broken
          Copy-Item (Join-Path $payload 'VERSION.txt') $broken

          # -Silent: the console is quiet, but the log must still say why it
          # stopped, because that log is all a shop can send us.
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $broken 'install.ps1') -Silent -NoLaunch | Out-Null
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0   # as above: exit 1 is the expected answer, not a failed step
          Remove-Item -LiteralPath $broken -Recurse -Force -ErrorAction SilentlyContinue

          if ($code -ne 1) { throw ("install.ps1 should refuse an incomplete payload with exit 1, exited " + $code) }
          Write-Host '  ok  install.ps1 refuses an incomplete payload'

          foreach ($folder in @('app', 'data')) {
            if (Test-Path -LiteralPath (Join-Path $root $folder)) {
              throw ("install.ps1 created " + $folder + "\ even though it refused to install")
            }
          }
          Write-Host '  ok  a refused install left no program and no data folder behind'

          if (-not (Test-Path -LiteralPath (Join-Path $root 'logs\install.log'))) {
            throw 'a refused install still has to leave its log behind'
          }
          $reason = Select-String -LiteralPath (Join-Path $root 'logs\install.log') -Pattern 'payload is incomplete' -SimpleMatch
          if (-not $reason) { throw 'the log does not say why the install stopped' }
          Write-Host '  ok  the log says why: ' $reason.Line.Trim()

  windows-installer:
    name: The built installer, unpacked, run and installed on Windows
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: offline/dist

      # This is the job the blob/runtime mismatch could not survive: it takes the
      # installer this run built, unpacks it with 7-Zip exactly as the SFX stub
      # does, runs the program inside it, starts the till, fetches its screen and
      # its API, and then runs install.cmd the way a shop does - checking
      # install.log, the installed bytes, the untouched data folder and
      # verify.ps1 afterwards. See installer/verify-windows.ps1.
      - name: Run the built installer on this Windows PC
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path offline\dist\SoftCora-POS-Setup.exe).Path
          $summary = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $report = (Join-Path (Get-Location) 'windows-verification.json')

          # -Report writes the result where the next step can find it whichever
          # way this goes, because the job's log is not always readable - the
          # annotations the verifier emits are what survives.
          & powershell -NoProfile -ExecutionPolicy Bypass -File offline\installer\verify-windows.ps1 -Installer $installer -Install -Report $report
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0   # the exit code is judged here, not by the shell

          if ($code -ne 0) {
            throw ("the installer did not verify on Windows (exit " + $code + ", sha256 " + $summary + ")")
          }
          Write-Host ('  ok  SoftCora-POS-Setup.exe ran, served its screen and installed itself (sha256 ' + $summary + ')')

      - name: Say what the verification found, whichever way it went
        if: always()
        shell: powershell
        run: |
          $report = 'windows-verification.json'
          if (-not (Test-Path -LiteralPath $report)) {
            Write-Host 'the verifier wrote no report - read the job log above'
            exit 0
          }

          $parsed = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          Write-Host ("  ok=" + $parsed.ok + ", " + @($parsed.checks).Count + ' checks')
          foreach ($check in @($parsed.checks)) {
            $mark = 'ok  '
            if (-not $check.ok) { $mark = 'FAIL' }
            Write-Host ('  ' + $mark + ' ' + $check.name + ' - ' + $check.detail)
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          if-no-files-found: warn
          retention-days: 7
          path: windows-verification.json
