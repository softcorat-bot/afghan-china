<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Afghan China MIS — POS terminal mark. A card terminal printing a
       receipt: it reads as "point of sale" even at 16 px, where the shape
       is just a gold block with a dark screen and a pale slip above it. -->
  <defs>
    <linearGradient id="acBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E6DA4"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="acGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DEA0"/>
      <stop offset="1" stop-color="#C8862D"/>
    </linearGradient>
    <linearGradient id="acScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A66"/>
      <stop offset="1" stop-color="#08111F"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#acBg)"/>

  <!-- receipt printing out of the top -->
  <g transform="rotate(-4 256 150)">
    <path d="M168 74h176v128H168z" fill="#FFF6E3"/>
    <path d="M168 202l22 14 22-14 22 14 22-14 22 14 22-14 22 14 22-14V202z" fill="#FFF6E3"/>
    <g stroke="#C8862D" stroke-width="14" stroke-linecap="round" opacity=".85">
      <path d="M196 112h120M196 152h74"/>
    </g>
  </g>

  <!-- terminal body -->
  <rect x="112" y="186" width="288" height="252" rx="34" fill="url(#acGold)"/>
  <rect x="146" y="214" width="220" height="96" rx="16" fill="url(#acScreen)"/>
  <g fill="#F6DEA0">
    <path d="M170 234h112v16H170z"/>
    <path d="M170 268h64v14h-64z" opacity=".55"/>
  </g>

  <!-- keypad -->
  <g fill="#0A1628" opacity=".82">
    <rect x="156" y="338" width="52" height="30" rx="10"/>
    <rect x="230" y="338" width="52" height="30" rx="10"/>
    <rect x="304" y="338" width="52" height="30" rx="10"/>
    <rect x="156" y="386" width="52" height="30" rx="10"/>
    <rect x="230" y="386" width="52" height="30" rx="10"/>
  </g>
  <rect x="304" y="386" width="52" height="30" rx="10" fill="#1FA463"/>
</svg>
